name: Foto resumen de jornada

on:
  workflow_dispatch:
  schedule:
    # 22:55 UTC (23:55 o 00:55 en Madrid). GitHub lo retrasa a veces varias horas,
    # por eso no se filtra por hora: si no hay jornada nueva la foto no cambia y no
    # hay commit. Temporada sep-jun.
    - cron: "55 22 * 9-12,1-6 *"

permissions:
  contents: write

jobs:
  foto:
    runs-on: ubuntu-latest
    env:
      EUROLEAGUE_FEEDS_V2: ${{ secrets.EUROLEAGUE_FEEDS_V2 }}
      EUROLEAGUE_FEEDS_V3: ${{ secrets.EUROLEAGUE_FEEDS_V3 }}
    steps:
      - uses: actions/checkout@v4

      - name: Fuentes (Oswald, Font Awesome y Signate Grotesk)
        env:
          # Signate recortada a latin, en gzip + base64 (no se publica en el repo)
          SIGNATE_FONT: ${{ secrets.SIGNATE_FONT }}
        run: |
          mkdir -p ~/.fonts
          curl -fsSL -o ~/.fonts/Oswald.ttf \
            "https://github.com/google/fonts/raw/main/ofl/oswald/Oswald%5Bwght%5D.ttf" \
            || echo "No se pudo descargar Oswald"
          curl -fsSL -o /tmp/fa.zip \
            "https://github.com/FortAwesome/Font-Awesome/releases/download/6.5.2/fontawesome-free-6.5.2-desktop.zip" \
            && unzip -j -o /tmp/fa.zip "*otfs/*.otf" -d ~/.fonts \
            || echo "No se pudo descargar Font Awesome"
          echo "$SIGNATE_FONT" | base64 -d | gunzip > ~/.fonts/signategrotesk-black.ttf \
            || echo "Falta el secret SIGNATE_FONT"
          fc-cache -f
          fc-list | grep -i signate || echo "Signate Grotesk no instalada"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::httr
            any::janitor
            any::gt
            any::webshot2
            any::glue
            any::htmltools

      - name: Sacar la foto
        run: Rscript scripts/resumen_jornada.R

      - name: Commit y push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add png
          git diff --cached --quiet && exit 0
          git commit -m "Auto: foto resumen jornada $(TZ=Europe/Madrid date +%Y-%m-%d)"
          git pull --rebase
          git push
